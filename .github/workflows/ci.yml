name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system deps (PyQt offscreen)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 xvfb

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-qt

      - name: Run full test suite
        run: |
          xvfb-run -a python -m pytest tests -q

      - name: Coverage report (informational)
        run: |
          pip install coverage
          xvfb-run -a python -m coverage run --source=modules --omit="modules/__init__.py" -m pytest tests -q
          xvfb-run -a python -m coverage report
          xvfb-run -a python -m coverage html
