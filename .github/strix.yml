# Strix Configuration — SmartAccounting
# Docs: https://docs.strix.ai

targets:
  - name: "GitHub Pages Site"
    url: https://khalilmebarek-creator.github.io/SmartAccounting/
    type: web

scope:
  include:
    - "**/*.py"
    - "**/*.js"
    - "**/*.html"
    - "**/*.qss"
  exclude:
    - "mobile/**"
    - "thesis/**"
    - "artifacts/**"
    - "dist_nuitka/**"
    - "installer_output/**"
    - "tests/**"

agents:
  recon:
    enabled: true
  exploit:
    enabled: true
  post_exploit:
    enabled: false  # لا نحتاج استغلال بعد

checks:
  - sql_injection
  - xss
  - csrf
  - secrets
  - hardcoded_credentials
  - insecure_transport
  - path_traversal
  - command_injection
  - unsafe_deserialization
  - directory_listing
