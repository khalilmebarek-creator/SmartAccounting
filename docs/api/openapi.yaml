openapi: 3.0.3
info:
  title: Smart Accounting Platform — واجهات الخدمات الداخلية
  description: 'واجهات برمجية (Python APIs) لخدمات المنصة المحاسبية الذكية.

    هذه واجهات داخلية تُستدعى من طبقة الواجهة (ui/) أو سكربتات الأتمتة/الاختبار، ومصوّرة
    هنا بصيغة OpenAPI 3.0 لمعاينتها داخل Swagger UI. المعاملات هي وسائط دوال Python.

    استجابة كل عملية: {status: "ok", data: <القيمة الراجعة>} عند النجاح أو {status:
    "error", error: <رسالة>} عند الفشل.'
  version: 3.1.7
  contact:
    name: Smart Accounting Platform
servers:
- url: http://localhost:8080
  description: محلي — عبر serve.py
tags:
- name: activity_log
  description: سجل الأنشطة والتغييرات للمستخدمين
- name: advanced_dashboard
  description: لوحة التحكم المتقدمة (KPI/رسوم/تنبيهات/رادار)
- name: ai_insights
  description: 'محرك الرؤى الذكية: تنبؤ، شذوذ، أنماط، توصيات'
- name: analysis
  description: 'المحلل المالي: الاتجاهات، DuPont، رأس المال العامل، التدفقات'
- name: audit
  description: محرك التدقيق والمراجعة على القوائم المالية
- name: backup
  description: إدارة النسخ الاحتياطي (DB/JSON) والاسترجاع
- name: bank_sync
  description: استيراد كشوف البنوك والمطابقة
- name: benchmarks
  description: المعايير المرجعية والمقارنة القطاعية والمنافسين
- name: breakeven
  description: تحليل نقطة التعادل والحساسية
- name: budget
  description: الموازنة السنوية وتحليل الانحرافات
- name: calculations
  description: محسّن النسب المالية (21 نسبة + Z-Score Altman)
- name: cashflow
  description: كشف التدفقات النقدية
- name: cloud_sync
  description: المزامنة السحابية والنسخ الاحتياطي المشفّر
- name: comparative
  description: التحليل المقارن عبر السنوات
- name: cost_center
  description: تحليل مراكز التكلفة
- name: cost_center_profitability
  description: ربحية مراكز التكلفة والتوزيعات والمقارنات
- name: csv_import
  description: كشف صيغ الملفات والترميز ورسم الأعمدة
- name: currency
  description: تعدد العملات وأسعار الصرف والتحويل
- name: data_import
  description: استيراد البيانات من Excel/CSV
- name: demo_data
  description: الشركات التجريبية والبيانات النموذجية
- name: demo_templates
  description: قوالب استيراد/تصدير CSV للشركات التجريبية
- name: email_notifier
  description: إرسال التنبيهات والملخصات عبر البريد
- name: excel_export
  description: تصدير التقارير الشاملة إلى Excel
- name: forecasting
  description: التنبؤ المالي (إيرادات/دخل/CAGR/سيناريوهات)
- name: fraud_detection
  description: كشف التلاعب والاحتيال والتنبيهات
- name: print_manager
  description: الطباعة عبر HTML
- name: report_templates
  description: قوالب التقارير المخصصة
- name: reporting
  description: توليد التقارير المالية وتصديرها (نص/PDF/Excel)
- name: scenarios
  description: تحليل السيناريوهات (مثالي/طبيعي/أسوأ) وحساسية Tornado
- name: scheduled_backup
  description: النسخ الاحتياطي المجدول والاسترجاع
- name: tax
  description: النظام الجبائي الجزائري (IBS/TVA/IRG/CNAS/CNAC/DAS)
- name: tax_reminders
  description: التذكيرات والتقويم الجبائي
- name: tax_reports
  description: توليد الإقرارات الجبائية G50/G57/DAS
- name: update_checker
  description: التحقق من التحديثات وتحميل المثبّت والاسترجاع
- name: user_manager
  description: إدارة المستخدمين والأدوار والصلاحيات و2FA
- name: user_testing
  description: 'اختبار المستخدمين: جلسات وملاحظات ورضا وتقارير'
- name: validation
  description: التحقق من صحة القيود المالية وإصدار الأخطاء/التحذيرات
